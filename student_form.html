<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Placement Form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: url("/static/images/thapar_background.webp") no-repeat center center fixed;
            background-size: cover;
            font-family: 'Segoe UI', sans-serif;
        }
        .form-container {
            max-width: 750px;
            margin: 50px auto;
            background: rgba(255, 255, 255, 0.95);
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        .thapar-logo {
            width: 90px;
            display: block;
            margin: 0 auto 15px auto;
        }
    </style>
</head>
<body>

<div class="form-container">

    <img src="/static/images/thapar_logo.webp" class="thapar-logo">

    <h2 class="text-center mb-4">Student Placement Form</h2>

    <form id="studentForm" enctype="multipart/form-data">

        <!-- hidden email -->
        <input type="hidden" name="email" value="{{ email }}">

        <label>Full Name</label>
        <input type="text" class="form-control mb-3" name="name" required>

        <label>Roll Number</label>
        <input type="text" class="form-control mb-3" name="roll_no" required>

        <label>College Email</label>
        <input type="email" class="form-control mb-3" name="personal_email">

        <h5 class="mt-4 mb-2">Placement Details</h5>

        <label>Company</label>
        <input type="text" class="form-control mb-3" name="company">

        <label>City</label>
        <input type="text" class="form-control mb-3" name="city">

        <label>Stipend</label>
        <input type="text" class="form-control mb-3" name="stipend">

        <label>Role Offered</label>
        <input type="text" class="form-control mb-3" name="role_offered">

        <label>Joining Date</label>
        <input type="date" class="form-control mb-3" name="joining_date">

        <label>Address</label>
        <textarea class="form-control mb-3" name="address"></textarea>

        <label>Upload Photo (optional)</label>
        <input type="file" class="form-control mb-4" name="photo">

        <button class="btn btn-primary w-100" type="submit">Save Details</button>
    </form>

</div>

<script>
document.getElementById("studentForm").onsubmit = async function (e) {
    e.preventDefault();

    let formData = new FormData(this);

    let res = await fetch("/add_student", {
        method: "POST",
        body: formData
    });

    let output = await res.json();

    if (output.status === "success") {
        window.location.href = "/upload_offer_letter";
    }
};
</script>

</body>
</html>

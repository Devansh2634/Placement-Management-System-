<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title if title else "Placement Portal" }}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: url('/static/images/thapar_background.webp') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Segoe UI', sans-serif;
        }

        .content-box {
            max-width: 550px;
            margin: 50px auto;
            padding: 35px;
            background: rgba(255, 255, 255, 0.92);
            border-radius: 15px;
            backdrop-filter: blur(6px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .thapar-logo {
            width: 150px;
            display: block;
            margin: 0 auto 15px auto;
        }
    </style>
</head>

<body>

    {% block content %}
    {% endblock %}

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Upload Offer Letter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: url("/static/images/thapar_background.webp") center center fixed;
            background-size: cover;
            font-family: 'Segoe UI', sans-serif;
        }
        .box {
            max-width: 550px;
            margin: 70px auto;
            background: rgba(255,255,255,0.96);
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.2);
        }
        .thapar-logo {
            width: 90px;
            display: block;
            margin: 0 auto 20px auto;
        }
    </style>
</head>
<body>

<div class="box">

    <img src="/static/images/thapar_logo.webp" class="thapar-logo">

    <h3 class="text-center mb-3">Upload Offer Letter</h3>
    <p class="text-center text-muted">
        Please upload your offer letter (PDF only).<br>
        Once uploaded, your status will be updated to <b>Placed</b>.
    </p>

    <!--  NORMAL FORM SUBMISSION (NO JAVASCRIPT) -->
    <form action="/upload_offer" method="POST" enctype="multipart/form-data">

        <input type="hidden" name="email" value="{{ student.email }}">

        <label>Select Offer Letter (PDF only)</label>
        <input type="file" class="form-control mb-4" name="offer_letter" accept="application/pdf" required>

        <button class="btn btn-primary w-100" type="submit">Upload</button>

        <a href="/student_dashboard" class="btn btn-secondary w-100 mt-3">Back to Dashboard</a>
    </form>

</div>

</body>
</html>

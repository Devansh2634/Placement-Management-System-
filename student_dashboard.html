<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: url("/static/images/thapar_background.webp") center center fixed;
            background-size: cover;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
        }

        /* Top Navbar */
        .navbar-custom {
            background-color: #8C1D40;  /* Thapar Maroon */
            padding: 15px;
        }

        .navbar-custom .navbar-brand {
            color: white;
            font-weight: 600;
            font-size: 22px;
        }

        .navbar-custom .btn-logout {
            background-color: #f8d7da;
            color: #8C1D40;
            border: none;
            font-weight: 600;
        }

        /* Main Box */
        .box {
            max-width: 750px;
            margin: 50px auto;
            background: rgba(255,255,255,0.95);
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.25);
            backdrop-filter: blur(3px);
        }

        .thapar-logo {
            width: 95px;
            display: block;
            margin: 0 auto 15px;
        }

        .title {
            font-weight: 700;
            text-align: center;
            margin-bottom: 20px;
        }

        .info-box {
            background: #f7f7f7;
            padding: 18px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .info-item b {
            color: #8C1D40;
        }

        .btn-custom {
            padding: 12px;
            border-radius: 10px;
            font-size: 16px;
        }

        .btn-update {
            background-color: #0056d2;
            color: white;
        }

        .btn-offer {
            background-color: #0a7b42;
            color: white;
        }
    </style>
</head>

<body>


<nav class="navbar navbar-custom d-flex justify-content-between">
    <span class="navbar-brand ms-3">Thapar Student Dashboard</span>

    <a href="/logout" class="btn btn-logout me-3 px-3">
        Logout
    </a>
</nav>


<div class="box">

    <img src="/static/images/thapar_logo.webp" class="thapar-logo">

    <h2 class="title">Welcome, {{ student.name }}</h2>

    <!-- Student Info Box -->
    <div class="info-box">
        <p class="info-item"><b>Email:</b> {{ student.email }}</p>
        <p class="info-item"><b>Roll Number:</b> {{ student.roll_no }}</p>
        <p class="info-item"><b>Status:</b> {{ student.status }}</p>
    </div>

    <!-- Buttons -->
    <a href="/student_form" class="btn btn-update w-100 btn-custom mb-3">
        Update Your Details
    </a>

    <a href="/upload_offer_letter" class="btn btn-offer w-100 btn-custom">
        Upload Offer Letter
    </a>

</div>

</body>
</html>
